<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&amp;family=Cormorant+Garamond:wght@400;500&amp;family=Montserrat:wght@300;400;500&amp;display=swap');
      
      .wordmark-light {
        font-family: 'Cinzel', 'Cormorant Garamond', 'Didot', 'Bodoni MT', 'Times New Roman', serif;
        font-size: 82px;
        font-weight: 500;
        letter-spacing: 0.28em;
        fill: #F7F5F0;
        text-anchor: middle;
      }
      
      .descriptor-light {
        font-family: 'Montserrat', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 13px;
        font-weight: 300;
        letter-spacing: 0.52em;
        text-transform: uppercase;
        fill: #C4BCB3;
        text-anchor: middle;
      }

      .divider-light {
        stroke: #CBB99F;
        stroke-width: 0.75;
        stroke-linecap: round;
        opacity: 0.85;
      }

      .accent-dot-light {
        fill: #CBB99F;
      }
    </style>
  </defs>

  <!-- Light Version for Dark Backgrounds -->
  <g transform="translate(500, 110)">
    <!-- Wordmark in Warm Ivory -->
    <text class="wordmark-light" x="16" y="0">AURELIS</text>

    <!-- Refined Champagne Accent Divider -->
    <line class="divider-light" x1="-160" y1="36" x2="-20" y2="36" />
    <polygon class="accent-dot-light" points="0,32 4,36 0,40 -4,36" />
    <line class="divider-light" x1="20" y1="36" x2="160" y2="36" />

    <!-- Subtitle Descriptor -->
    <text class="descriptor-light" x="4" y="68">LUXURY FRAGRANCE</text>
  </g>
</svg>
