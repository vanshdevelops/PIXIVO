<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141522" />
      <stop offset="50%" stop-color="#0a0a0f" />
      <stop offset="100%" stop-color="#050508" />
    </radialGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <linearGradient id="purpleMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGrad)" />

  <!-- Outer Rounded Border (Matching founder.jpg aesthetic) -->
  <rect x="20" y="20" width="560" height="560" rx="40" ry="40" fill="none" stroke="#00f0ff" stroke-width="2.5" opacity="0.9" />

  <!-- Minimalist Geometric Avatar -->
  <!-- Head circle -->
  <circle cx="300" cy="220" r="60" fill="none" stroke="#00f0ff" stroke-width="4" filter="url(#glowCyan)" />

  <!-- Shoulders arc -->
  <path d="M 160 430 A 140 130 0 0 1 440 430 Z" fill="none" stroke="#7928ca" stroke-width="4" />

  <!-- Geometric Accent Blocks (Matching founder.jpg style) -->
  <!-- Upper Left Accent Cube -->
  <rect x="140" y="150" width="40" height="40" fill="#00f0ff" rx="4" />
  <!-- Lower Right Accent Cube -->
  <rect x="420" y="380" width="36" height="36" fill="#ff0080" rx="4" />

  <!-- Subtle Monogram in Head Center -->
  <text x="300" y="228" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="24" font-weight="700" fill="#00f0ff" text-anchor="middle" letter-spacing="2">HK</text>

  <!-- Leadership Label Overlay -->
  <g opacity="0.65">
    <rect x="220" y="470" width="160" height="26" rx="13" fill="rgba(0, 240, 255, 0.08)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1" />
    <text x="300" y="487" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="11" font-weight="700" fill="#00f0ff" text-anchor="middle" letter-spacing="2.5">CO-FOUNDER</text>
  </g>
</svg>
